<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Оформление заказа</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; }
    label { display: block; margin: 10px 0 4px; }
    input, button { width: 100%; padding: 8px; box-sizing: border-box; }
    #result { margin-top: 16px; white-space: pre-wrap; color: #036; }
    #result.success { color: #070; font-weight: 600; }
    #result.error   { color: #b00; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Новый заказ</h1>
  <form id="orderForm">
    <label>Покупатель <input name="customer" required /></label>
    <label>Товар      <input name="item" required /></label>
    <label>Сумма      <input name="amount" type="number" step="0.01" min="0" required /></label>
    <button type="submit">Отправить</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById('orderForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const payload = {
        customer: f.customer.value.trim(),
        item:     f.item.value.trim(),
        amount:   parseFloat(f.amount.value)
      };
      const out = document.getElementById('result');
      out.className = '';
      out.textContent = 'Отправка...';
      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok) {
          out.className = 'success';
          out.textContent = 'Заказ успешно зарегистрирован. Хотите сделать новый?';
          f.reset();
        } else {
          out.className = 'error';
          out.textContent = 'Ошибка: ' + (data.error || 'не удалось оформить заказ');
        }
        //out.textContent = JSON.stringify(data, null, 2); - вывод чистого JSON как ответ на записанный заказ
        if (res.ok) f.reset();
      } catch (err) {
        out.className = 'error';
        out.textContent = 'Ошибка: ' + err;
      }
    });
  </script>
</body>
</html>
